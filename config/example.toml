# Copy to local.toml. Use the port assigned to your Blue Archive instance.
[device]
serial = "127.0.0.1:5695"
package = "com.nexon.bluearchive"
adb_path = "adb"

[restart]
auto_download = true
poll_interval = 1.5
startup_timeout = 300
download_timeout = 1800
unknown_timeout = 60
home_confirmations = 3
action_cooldown = 3.0

[automation]
# Close only Blue Archive after the final queued task; the emulator stays open.
close_app_when_idle = false

[cafe]
schedule_enabled = false
invite_enabled = false
# Exact English in-game name, including variant, e.g. "Yuuka (Track)".
invite_student = ""

[lessons]
# Scan every available location before choosing the rooms with the most owned students.
# school_rank instead levels the lowest rank + XP location, rechecking each ticket.
strategy = "relationship"
# 0 uses all tickets already available; the runner never purchases more.
max_tickets = 0
# Empty means all unlocked locations; otherwise use exact English location names.
locations = []
enabled_in_daily = true

[crafting]
# Uses the preset already configured in game, spends available keystones, and
# queues collection/refill visits when each slot finishes. No booster tickets.
schedule_enabled = false

# Paths are relative to this configuration file.
[storage]
run_dir = "../data/runs"
lock_dir = "../data/locks"
state_dir = "../data/state"
