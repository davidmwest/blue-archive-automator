# Copy to local.toml. Use the port assigned to your Blue Archive instance.
[device]
serial = "127.0.0.1:5695"
package = "com.nexon.bluearchive"
adb_path = "adb"

[restart]
auto_download = true
poll_interval = 1.5
startup_timeout = 300
download_timeout = 1800
unknown_timeout = 60
home_confirmations = 3
action_cooldown = 3.0

[automation]
# Close only Blue Archive after the final queued task; the emulator stays open.
close_app_when_idle = false

[cafe]
schedule_enabled = false
invite_enabled = false
# Exact English in-game name, including variant, e.g. "Yuuka (Track)".
invite_student = ""

[lessons]
# Scan every available location before choosing the rooms with the most owned students.
# school_rank instead levels the lowest rank + XP location, rechecking each ticket.
strategy = "relationship"
# 0 uses all tickets already available; the runner never purchases more.
max_tickets = 0
# Empty means all unlocked locations; otherwise use exact English location names.
locations = []
enabled_in_daily = true

[total_assault]
# Mock-test this difficulty before spending a ticket; stop if it cannot be verified.
difficulty = "hardcore" # normal, hard, very_hard, hardcore, extreme, insane, torment, lunatic
enabled_in_daily = false
# Minimum seconds left in a winning mock battle before allowing the real attempt.
comfort_seconds = 30

[crafting]
# Uses the preset already configured in game, spends available keystones, and
# queues collection/refill visits when each slot finishes. No booster tickets.
schedule_enabled = false

[packs]
# REAL MONEY. Enable each pack separately. Google Play payment must already be
# configured in this emulator. Verification/setup prompts stop the job.
# Checks once per Global game day; buys only when the previous pack is inactive.
# Permanent English/USD products only; no limited-event packs or bulk Pyroxenes.
monthly_enabled = false
half_monthly_enabled = false
ap_enabled = false
monthly_max_cents = 699
half_monthly_max_cents = 299
ap_max_cents = 299

[ap]
# Spend existing AP only; never buys refills or Hard attempt resets.
schedule_enabled = false
floor = 100
strategy = "elephs" # elephs, reports, or credits
hard_default_order = true
# Custom order accepts scanned three-star stages only. Empty custom order spends nothing.
hard_order = []

# Paths are relative to this configuration file.
[storage]
run_dir = "../data/runs"
lock_dir = "../data/locks"
state_dir = "../data/state"

[bounties]
enabled_in_daily = true

[scrimmages]
enabled_in_daily = true
